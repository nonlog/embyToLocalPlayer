name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python ${{ matrix.python-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.13'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q embyToLocalPlayer.py utils embyBangumi

  provider-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal runtime dependency
        run: python -m pip install 'requests>=2.31,<3'

      - name: Import provider API modules
        shell: bash
        run: |
          python - <<'PY'
          import importlib

          for module in (
              "utils.trakt_api",
              "utils.simkl_api",
              "utils.bangumi_api",
          ):
              importlib.import_module(module)
          PY
